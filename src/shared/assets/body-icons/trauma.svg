<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="270 555 1510 940"><style>
  @keyframes amb-light-breath {
    0%, 100% { opacity: 0.4; transform: scale(0.92); }
    50%      { opacity: 1;   transform: scale(1); }
  }
  .amb-light { animation: amb-light-breath 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .amb-light:nth-of-type(2) { animation-delay: 0.4s; }
  @media (prefers-reduced-motion: reduce) { .amb-light { animation: none !important; opacity: 1 !important; transform: none !important; } }
